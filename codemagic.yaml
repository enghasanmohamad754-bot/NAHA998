workflows:
  python-android-kivy:
    name: Build Python Android App (EngHasan998)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - open_source
    scripts:
      - name: Install System Dependencies & Buildozer
        script: |
          pip3 install --upgrade pip
          pip3 install buildozer cython setuptools
      - name: Accept Android Licenses Automatically
        script: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
      - name: Build Android APK
        script: |
          yes | buildozer -v android debug
    artifacts:
      - bin/*.apk
